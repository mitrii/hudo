version: "2"

linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    # style / bugs
    - godot
    - misspell
    - unconvert
    - unparam
    - noctx
    - bodyclose
    - dupl
    - gocognit
    - gocritic
    - gosec
    - nilerr
    - prealloc
    - revive
    - whitespace
    - wsl_v5

linters-settings:
  gocognit:
    min-complexity: 15
  gosec:
    excludes:
      - G204  # subprocess launched with variable — intentional (this tool IS sudo)
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-return
      - name: error-strings
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: increment-decrement
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: unused-parameter
  wsl_v5:
    allow-first-in-block: true
    allow-whole-block: false
    branch-max-lines: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
