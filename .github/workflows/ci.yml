name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Test
        run: go test ./...

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          - goarch: amd64
            goarm: ""
          - goarch: arm64
            goarm: ""
          - goarch: arm
            goarm: "7"
          - goarch: "386"
            goarm: ""

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          SUFFIX="${{ matrix.goarch }}"
          [ -n "${{ matrix.goarm }}" ] && SUFFIX="${SUFFIX}v${{ matrix.goarm }}"
          go build -ldflags="-s -w" -o "hudo-linux-${SUFFIX}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hudo-linux-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: hudo-linux-*
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Build release binaries
        run: |
          targets="amd64: arm64: arm:7 386:"
          for t in $targets; do
            arch="${t%%:*}"
            arm="${t##*:}"
            suffix="${arch}"
            [ -n "${arm}" ] && suffix="${arch}v${arm}"
            GOOS=linux GOARCH="${arch}" GOARM="${arm}" \
              go build -ldflags="-s -w" -o "hudo-linux-${suffix}" .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: hudo-linux-*
          generate_release_notes: true
